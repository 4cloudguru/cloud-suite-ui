name: Publish package

# Publishes @4cloudguru/cloud-suite-ui to GitHub Packages when a GitHub
# Release is published (tag the release vX.Y.Z to match package.json version).
#
# workflow_dispatch is kept only for re-running a publish against an EXISTING,
# already-tagged release (e.g. a transient registry failure) — the
# "Verify tag matches package.json version" step below refuses to publish
# unless the checked-out ref is exactly the git tag `v<package.json version>`,
# so a manual run against an arbitrary branch/commit can no longer bypass the
# tagged-release flow.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Serialise publishes so two release/dispatch runs can't race the same version to the registry.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Unprivileged build/test: runs npm ci and the full dependency lifecycle in a job that holds NO
  # publish/attestation permissions, so a poisoned transitive dependency cannot reach the registry
  # token, mint an OIDC token, or forge attestations. Produces the exact tarball + SBOM as artifacts.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      # audit, not block: this job runs npm ci/build/test — the full untrusted dependency
      # lifecycle — so its egress footprint isn't known/stable enough to allowlist safely. It
      # holds no publish/attestation secrets (see job comment above), so audit-only here is an
      # acceptable tradeoff; the privileged `publish` job below (no dependency install) uses
      # egress-policy: block with an explicit endpoint allowlist instead.
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history (0 = all branches/tags), not the default shallow depth-1 clone, so the
          # ancestry check below can walk back from the tagged commit to origin/main.
          fetch-depth: 0

      # package-manager-cache disabled: release-triggered job — zizmor flags setup-node v7's
      # auto-enabled cache here as a cache-poisoning risk even though npm ci runs below.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: "@4cloudguru"
          package-manager-cache: false

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF}" != "refs/tags/${PKG_VERSION}" ]; then
            echo "::error::GITHUB_REF (${GITHUB_REF}) does not match package.json version (${PKG_VERSION}). Refusing to publish an unreviewed/untagged ref."
            exit 1
          fi
          echo "Publishing ${PKG_VERSION} from ${GITHUB_REF} — OK"

      # In-repo half of the release-integrity control: the actual human-review gate is a
      # required-reviewer rule on the "release" GitHub Environment, configured in repo Settings
      # (not git — see FIX_REPORT notes for the read/write gh api commands). This step only
      # guarantees the tagged commit is not one that bypassed main entirely.
      - name: Verify release tag is reachable from main
        run: |
          git fetch --no-tags --quiet origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::The checked-out commit is not reachable from main. Refusing to publish a release cut from an unmerged/unreachable ref."
            exit 1
          fi

      # --ignore-scripts: this package's build (tsup/esbuild) and tests need no dependency install
      # scripts, so disabling them shrinks the untrusted-code surface even in this unprivileged job.
      - run: npm ci --ignore-scripts

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # Re-run the advisory audit at publish time (mirrors ci.yml) so a workflow_dispatch
      # re-publish of an older tag can't ship without a fresh advisory/signature check.
      - run: npm audit --audit-level=moderate
      - run: npm audit signatures

      - name: Verify the publish tarball contains exactly dist + docs (no more, no fewer)
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e "
            const { readdirSync } = require('node:fs');
            const pkg = require('/tmp/pack.json')[0];
            const actual = pkg.files.map((f) => f.path).sort();
            const distFiles = readdirSync('dist', { recursive: true }).map((f) => 'dist/' + f);
            const expected = ['LICENSE', 'NOTICE', 'README.md', 'package.json', ...distFiles].sort();
            const missing = expected.filter((p) => !actual.includes(p));
            const unexpected = actual.filter((p) => !expected.includes(p));
            if (missing.length) console.error('::error::Missing expected file(s) from the publish tarball: ' + missing.join(', '));
            if (unexpected.length) console.error('::error::Unexpected file(s) would be published: ' + unexpected.join(', '));
            if (missing.length || unexpected.length) process.exit(1);
          "

      # Pack the exact tarball once so the published bytes and the attestations below all bind to
      # the same digest. Validate the filename's shape before it becomes a cross-job output — it
      # is consumed by the privileged publish job below, so a malformed value must fail here.
      - name: Pack tarball
        id: pack
        run: |
          TARBALL=$(npm pack --silent | tail -n1)
          if ! [[ "$TARBALL" =~ ^4cloudguru-cloud-suite-ui-[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?\.tgz$ ]]; then
            echo "::error::npm pack produced an unexpected filename, refusing to publish it: $TARBALL"
            exit 1
          fi
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      # Content check, not just paths: the bytes inside the tarball must be exactly the dist/ this
      # job built two steps ago — a pack-time mutation (e.g. a lifecycle script slipped into a
      # dependency) cannot swap file contents undetected.
      #
      # TARBALL flows in via env:, not template-expanded into the script body (zizmor
      # template-injection) — same pattern as the "npm publish" step in the publish job below.
      - name: Verify tarball contents match the built dist byte-for-byte
        run: |
          mkdir -p /tmp/tarball-verify
          tar -xzf "$TARBALL" -C /tmp/tarball-verify
          diff -r /tmp/tarball-verify/package/dist dist
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}

      # Mechanical check for the "no embedded source" invariant scripts/strip-sourcemap-sources.mjs
      # is supposed to produce — parses every packed .map rather than trusting the build chain ran.
      - name: Verify no packed sourcemap embeds sourcesContent
        run: |
          node -e "
            const { readdirSync, readFileSync } = require('node:fs');
            const { join } = require('node:path');
            const dir = '/tmp/tarball-verify/package/dist';
            const offenders = readdirSync(dir, { recursive: true })
              .filter((f) => f.endsWith('.map'))
              .filter((f) => JSON.parse(readFileSync(join(dir, f), 'utf8')).sourcesContent);
            if (offenders.length) {
              console.error('::error::Packed sourcemap(s) still embed sourcesContent: ' + offenders.join(', '));
              process.exit(1);
            }
          "

      # CycloneDX BOM of the full dependency graph. Generated here (unprivileged) and attested in
      # the publish job. Release-asset upload is disabled so this job needs no contents: write.
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload publish artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-artifacts
          path: |
            ${{ steps.pack.outputs.tarball }}
            sbom.cyclonedx.json
          if-no-files-found: error
          retention-days: 1

  # Minimal privileged job: downloads only the vetted artifacts and publishes + attests them. It
  # holds the registry/OIDC/attestation permissions but runs no dependency code (no npm ci/build).
  publish:
    needs: build
    runs-on: ubuntu-latest
    # A deployment-branch/tag policy on the "release" environment (Settings > Environments)
    # restricts this job to v* tags; the environment reference also scopes secrets to this job.
    environment: release
    permissions:
      contents: read
      id-token: write # for actions/attest-* and npm trusted publishing (OIDC)
      attestations: write
    steps:
      # block, not audit: this job runs no dependency-install/build code (only downloads a
      # pre-built artifact and publishes/attests it), so its egress needs are fixed and known —
      # allowlist them instead of just auditing, since this job holds the registry/OIDC/
      # attestation credentials a compromised dependency would want to exfiltrate.
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            api.github.com:443
            fulcio.sigstore.dev:443
            github.com:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443

      # package-manager-cache disabled: this job never installs deps (only publishes the
      # pre-built artifact below), so the cache would be both useless and a cache-poisoning
      # risk (zizmor) in this release-triggered, privileged job.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: "@4cloudguru"
          package-manager-cache: false

      - name: Download publish artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: publish-artifacts

      # TARBALL flows in via env:, not template-expanded into the script body — the Pack tarball
      # step above already validated its shape, but this way it is never treated as anything but a
      # plain argument to npm publish.
      # Authentication is npm trusted publishing (OIDC) via the id-token: write permission above;
      # there is no npm token in this repo. --provenance is redundant under trusted publishing,
      # which generates it automatically, but is kept explicit so the guarantee is visible here.
      - run: npm publish "$TARBALL" --provenance
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}

      # Attest the exact tarball just published (not dist/** on disk): subject-path is the same
      # downloaded artifact npm publish above just used, so provenance binds to the bytes
      # consumers actually install rather than a rebuilt/re-derived copy.
      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ needs.build.outputs.tarball }}

      - name: Attest SBOM for the published tarball
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ needs.build.outputs.tarball }}
          sbom-path: sbom.cyclonedx.json
