---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # hardening-exception: egress-audit — this job installs from the npm registry
      #   and clones this repository; harden-runner has never run in this repository,
      #   so no endpoint baseline exists and a block policy written without one fails
      #   closed on its first run; audit is what produces that list
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck

  test:
    name: Test (${{ matrix.deps }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        deps: [latest, floor]
    steps:
      # hardening-exception: egress-audit — this job installs from the npm registry
      #   and clones this repository; harden-runner has never run in this repository,
      #   so no endpoint baseline exists and a block policy written without one fails
      #   closed on its first run; audit is what produces that list
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # Exercise the LOWEST advertised peer majors (what both consumer apps currently run) so the
      # supported floor is actually tested — the default install/devDeps pin the latest majors.
      #
      # overrides.react-router (package.json) pins react-router to 8.3.0 to patch
      # GHSA-qwww-vcr4-c8h2 in react-router-dom's own react-router dependency. Left in place, it
      # would ALSO force react-router-dom@^6's dependency to 8.3.0, silently defeating this leg's
      # whole point — react-router-dom@^6 never actually depends on react-router 8.x in the real
      # world. Delete it for this ephemeral, non-persisted (not committed/pushed) install only, so
      # the floor leg exercises react-router-dom@^6's own genuine react-router dependency.
      - if: matrix.deps == 'floor'
        run: npm pkg delete overrides.react-router
      - if: matrix.deps == 'floor'
        run: npm install --no-save --legacy-peer-deps --ignore-scripts react-router-dom@^6 i18next@^24 react-i18next@^15 # zizmor: ignore[adhoc-packages] deliberate floor-deps install (rationale above); --no-save, ephemeral only
      # Guard against the override (or the floor-leg deletion above) silently drifting: fail loudly
      # if the installed react-router major doesn't match what each leg is supposed to exercise.
      - name: Assert installed react-router matches this leg's expectation
        run: |
          RR_MAJOR=$(npm ls react-router --all --json 2>/dev/null | node -e "
            const data = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const find = (deps) => {
              if (!deps) return null;
              if (deps['react-router']) return deps['react-router'].version;
              for (const k of Object.keys(deps)) { const r = find(deps[k].dependencies); if (r) return r; }
              return null;
            };
            const v = find(data.dependencies);
            if (!v) { console.error('react-router not found in the tree'); process.exit(1); }
            console.log(v.split('.')[0]);
          ")
          echo "react-router major installed: $RR_MAJOR"
          if [ "${{ matrix.deps }}" = "floor" ] && [ "$RR_MAJOR" != "6" ]; then
            echo "::error::floor leg expected react-router major 6 (react-router-dom@^6's own dependency) but got $RR_MAJOR — the overrides.react-router deletion above did not take effect."
            exit 1
          fi
          if [ "${{ matrix.deps }}" = "latest" ] && [ "$RR_MAJOR" != "8" ]; then
            echo "::error::latest leg expected react-router major 8 (the package.json overrides.react-router security pin) but got $RR_MAJOR."
            exit 1
          fi
      - run: npm run test:coverage

  # The package now advertises engines >=22 <25; this job runs the suite on the
  # OLDEST supported Node so the floor is actually tested (the jobs above run
  # the newest). A separate job, not a matrix dimension, so the long-standing
  # "Test (latest)" / "Test (floor)" required-check contexts keep their names.
  node-floor:
    name: Test (node floor)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # hardening-exception: egress-audit — this job installs from the npm registry
      #   and clones this repository; harden-runner has never run in this repository,
      #   so no endpoint baseline exists and a block policy written without one fails
      #   closed on its first run; audit is what produces that list
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # hardening-exception: egress-audit — this job installs from the npm registry
      #   and clones this repository; harden-runner has never run in this repository,
      #   so no endpoint baseline exists and a block policy written without one fails
      #   closed on its first run; audit is what produces that list
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # hardening-exception: egress-audit — this job installs from the npm registry
      #   and clones this repository; harden-runner has never run in this repository,
      #   so no endpoint baseline exists and a block policy written without one fails
      #   closed on its first run; audit is what produces that list
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      # Verify registry signatures/provenance attestations of everything installed.
      - run: npm audit signatures

  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      # hardening-exception: egress-audit — this job installs from the npm registry
      #   and clones this repository; harden-runner has never run in this repository,
      #   so no endpoint baseline exists and a block policy written without one fails
      #   closed on its first run; audit is what produces that list
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  zizmor:
    name: Zizmor (workflow security lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # hardening-exception: egress-audit — this job clones this repository;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          annotations: true

  # The publish workflow's real human-review gate is a required-reviewer rule on the `release`
  # GitHub Environment, which lives in repo Settings rather than in git — so nothing in this
  # repository could previously tell you whether it was still there. This job reads the live
  # state and fails if it is not, turning an assumed control into a checked one (audit #56).
  #
  # GET /environments is documented as readable by anyone with repo read access, so the default
  # GITHUB_TOKEN with contents:read is sufficient — unlike the branch-protection endpoints, which
  # need an `administration` scope GITHUB_TOKEN can never be granted.
  release-gate:
    name: Release environment protection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # hardening-exception: egress-audit — this job calls the GitHub API;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Assert the release environment still requires a reviewer and is tag-scoped
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Both queries degrade to 0/false rather than erroring when the control is absent,
          # so a removed rule trips the guard below instead of failing the step ambiguously.
          reviewers=$(gh api "repos/$REPO/environments/release" \
            --jq '[.protection_rules[] | select(.type=="required_reviewers")] | first | .reviewers | length')
          if [ "$reviewers" -lt 1 ]; then
            echo "::error::The 'release' environment has no required_reviewers rule, so a publish to the registry would proceed with no human approval. See audit #56."
            exit 1
          fi

          tag_scoped=$(gh api "repos/$REPO/environments/release/deployment-branch-policies" \
            --jq '[.branch_policies[] | "\(.type):\(.name)"] | any(. == "tag:v*")')
          if [ "$tag_scoped" != "true" ]; then
            policies=$(gh api "repos/$REPO/environments/release/deployment-branch-policies" \
              --jq '[.branch_policies[] | "\(.type):\(.name)"] | join(", ")')
            echo "::error::The 'release' environment does not restrict deployments to v* tags (found: ${policies:-none}). See audit #56."
            exit 1
          fi

          echo "release environment OK: $reviewers required reviewer(s), deployments restricted to tag:v*"

  # ── Workflow schema (actionlint) ───────────────────────
  # zizmor lints workflows for SECURITY; it does not check that they are valid
  # GitHub Actions files. That gap shipped a real outage: removing a key left an
  # empty `with:` behind, which is a schema error, and five workflows across
  # three repositories failed at STARTUP -- zero jobs, no logs, and a run listed
  # by file path instead of name because GitHub could not parse far enough to
  # read it. Both yaml.safe_load and zizmor accepted the file.
  #
  # A startup failure runs no jobs, so it cannot fail a required check either.
  # Nothing in the pipeline was in a position to notice.
  actionlint:
    name: Workflow schema (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # hardening-exception: egress-audit — this job clones this repository;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          # shellcheck/pyflakes are separate concerns and not installed here; the
          # schema check is the part that prevents a startup failure.
          ./actionlint -shellcheck= -pyflakes= -color

  # Second gate, same family: zizmor audits workflow SECURITY, this audits
  # workflow HARDENING -- pins labelled, jobs bounded by a timeout,
  # harden-runner first, npm installs refusing dependency scripts.
  #
  # It lived in exactly ONE of the fourteen repos until now, and caught a real
  # defect the moment a shared-workflow pin reached it.
  #
  # script-ref MUST equal the pin above it: the checker is taken from
  # shared-workflows at that commit, so this repo cannot weaken its own gate by
  # editing a local copy -- there is no local copy.
  workflow-hardening:
    uses: 4cloudguru/shared-workflows/.github/workflows/workflow-hardening.yml@8b7215beac6420881d20d52f9b096edff4238ec9 # v1.6.1
    with:
      script-ref: 8b7215beac6420881d20d52f9b096edff4238ec9
